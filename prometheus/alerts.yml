groups:
  - name: test_alerts
    rules:
    - alert: TestAlertFromPrometheus
      expr: vector(1) > 0
      for: 10s
      labels:
        severity: warning
      annotations:
        summary: "Test Alert from Prometheus Rules"
        description: "This alert is generated by a Prometheus Rule file (alerts.yml) and should be visible in Prometheus UI."

    - alert: DatabaseConnectionSpike
      expr: vector(1) > 0
      for: 30s
      labels:
        severity: critical
        service: database
      annotations:
        summary: "High DB Connection Count"
        description: "Simulated alert for high database connections."

    - alert: HighLatencyAPI
      expr: vector(1) > 0
      for: 1m
      labels:
        severity: error
        service: api
      annotations:
        summary: "API Latency High"
        description: "Simulated alert for API latency > 500ms."

    - alert: CacheMissRatioHigh
      expr: vector(1) > 0
      for: 45s
      labels:
        severity: warning
        service: cache
      annotations:
        summary: "Cache Miss Ratio High"
        description: "Simulated alert for cache efficiency drop."

    - alert: DiskSpaceLow
      expr: vector(1) > 0
      for: 2m
      labels:
        severity: critical
        instance: prod-server-01
      annotations:
        summary: "Disk Space Low"
        description: "Simulated alert for disk usage > 90%."

    - alert: ApacheDown
      expr: apache_up == 0
      for: 30s
      labels:
        severity: critical
        service: apache
        instance: "{{ $labels.instance }}"
      annotations:
        summary: "Apache Service Down"
        description: "Apache web server is down on {{ $labels.instance }}."

    - alert: ApacheExporterDown74_208_225_85
      expr: up{job="apache-exporter", instance="74.208.225.85:9117"} == 0
      for: 1m
      labels:
        severity: critical
        service: apache
      annotations:
        summary: "Apache exporter unreachable on 74.208.225.85"
        description: "Prometheus cannot scrape apache_exporter on 74.208.225.85:9117."

    - alert: NodeExporterDown74_208_225_85
      expr: up{job="node-exporter", instance="74.208.225.85:9100"} == 0
      for: 1m
      labels:
        severity: warning
        service: host
      annotations:
        summary: "Node exporter unreachable on 74.208.225.85"
        description: "Prometheus cannot scrape node_exporter on 74.208.225.85:9100."

    - alert: HighCpu74_208_225_85
      expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle", instance="74.208.225.85:9100"}[5m])) * 100) > 85
      for: 10m
      labels:
        severity: warning
        service: host
      annotations:
        summary: "High CPU on 74.208.225.85"
        description: "CPU utilization on 74.208.225.85 has been above 85% for 10 minutes."
