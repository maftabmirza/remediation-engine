name: CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 2 * * *'    # Nightly E2E tests
    - cron: '0 3 * * 1'    # Weekly performance tests (Monday)
  workflow_dispatch:
    inputs:
      job:
        description: 'Manual job to trigger'
        required: false
        default: 'all'
        type: choice
        options: [all, e2e-tests, performance-tests]

jobs:

  # ──────────────────────────────────────────────────────────────
  # Job 1: Lint & Type Check  (fast fail — runs first)
  # ──────────────────────────────────────────────────────────────
  lint-and-type-check:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install linting tools
        run: |
          pip install black ruff mypy
          pip install -r requirements.txt

      - name: Black format check
        run: black --check app/ tests/ || true

      - name: Ruff lint
        run: ruff check app/ tests/ || true

      - name: Mypy type check
        run: mypy app/ --ignore-missing-imports || true

  # ──────────────────────────────────────────────────────────────
  # Job 2: Unit Tests  (no DB)
  # ──────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    needs: lint-and-type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Run unit tests
        env:
          JWT_SECRET_KEY: ${{ secrets.CI_JWT_SECRET_KEY || 'test-secret-key-for-ci' }}
          ENCRYPTION_KEY: ${{ secrets.CI_ENCRYPTION_KEY || 'test-encryption-key-32chars-ok!' }}
        run: pytest tests/unit -v --cov=app --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unit
          fail_ci_if_error: false

      - name: Upload coverage HTML
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage-html
          path: htmlcov/
          retention-days: 7

  # ──────────────────────────────────────────────────────────────
  # Job 3: Integration Tests  (pgvector:pg16 + Atlas migrations)
  # ──────────────────────────────────────────────────────────────
  integration-tests:
    name: Integration Tests
    needs: lint-and-type-check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aiops
          POSTGRES_PASSWORD: ${{ secrets.TEST_DB_PASSWORD || 'aiops_secure_password' }}
          POSTGRES_DB: aiops_test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Install PostgreSQL client
        run: sudo apt-get install -y postgresql-client

      - name: Apply database migrations
        env:
          PGPASSWORD: ${{ secrets.TEST_DB_PASSWORD || 'aiops_secure_password' }}
        run: |
          for f in $(ls atlas/migrations/*.sql | sort); do
            echo "Applying $f"
            psql -h localhost -U aiops -d aiops_test -f "$f"
          done

      - name: Run integration tests
        env:
          DATABASE_URL: postgresql://aiops:${{ secrets.TEST_DB_PASSWORD || 'aiops_secure_password' }}@localhost:5432/aiops_test
          JWT_SECRET_KEY: ${{ secrets.CI_JWT_SECRET_KEY || 'test-secret-key-for-ci' }}
          ENCRYPTION_KEY: ${{ secrets.CI_ENCRYPTION_KEY || 'test-encryption-key-32chars-ok!' }}
        run: pytest tests/integration -v --cov=app --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: integration
          fail_ci_if_error: false

  # ──────────────────────────────────────────────────────────────
  # Job 4: Security Scan  (parallel with Jobs 2 & 3)
  # ──────────────────────────────────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install security tools
        run: pip install bandit pip-audit

      - name: Bandit SAST scan
        run: |
          bandit -r app/ -ll -f json -o bandit-report.json || true
          bandit -r app/ -ll || true

      - name: pip-audit CVE scan
        run: pip-audit -r requirements.txt || true

      - name: Install Trivy
        run: |
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update && sudo apt-get install -y trivy

      - name: Trivy filesystem scan
        run: trivy fs --exit-code 0 --severity HIGH,CRITICAL --ignore-unfixed . || true

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: bandit-report.json
          retention-days: 30

  # ──────────────────────────────────────────────────────────────
  # Job 5: Deploy to Test Server  (self-hosted, main branch only)
  # ──────────────────────────────────────────────────────────────
  deploy-to-test:
    name: Deploy to Test (74.208.225.85)
    needs: [lint-and-type-check, unit-tests, integration-tests, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: self-hosted
    steps:
      - name: Pull latest code
        run: |
          cd /aiops
          git fetch origin
          git reset --hard HEAD
          git clean -fd
          git checkout main
          git reset --hard origin/main

      - name: Build and restart app
        run: |
          cd /aiops
          docker compose up -d --build remediation-engine

      - name: Apply database migrations
        run: |
          cd /aiops
          for f in $(ls atlas/migrations/*.sql | sort); do
            echo "Applying $f"
            docker compose exec -T postgres psql -U aiops -d aiops -f - < "$f" || true
          done

      - name: Smoke test
        run: |
          sleep 15
          curl -f http://localhost:8080/health

  # ──────────────────────────────────────────────────────────────
  # Job 6: E2E Tests  (self-hosted, nightly schedule or manual)
  # ──────────────────────────────────────────────────────────────
  e2e-tests:
    name: E2E Tests
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 2 * * *') ||
      (github.event_name == 'workflow_dispatch')
    runs-on: self-hosted
    steps:
      - name: Pull latest code
        run: |
          cd /aiops
          git fetch origin
          git reset --hard HEAD
          git clean -fd
          git checkout main
          git reset --hard origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          cd /aiops
          pip install -r requirements.txt
          pip install -r requirements-test.txt
          playwright install --with-deps chromium

      - name: Run E2E tests
        env:
          BASE_URL: http://localhost:8080
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME || 'admin' }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          cd /aiops
          pytest tests/e2e -v

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: test-results/
          retention-days: 7

  # ──────────────────────────────────────────────────────────────
  # Job 7: Performance Tests  (self-hosted, weekly or manual)
  # ──────────────────────────────────────────────────────────────
  performance-tests:
    name: Performance Tests
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 3 * * 1') ||
      (github.event_name == 'workflow_dispatch')
    runs-on: self-hosted
    steps:
      - name: Pull latest code
        run: |
          cd /aiops
          git fetch origin
          git reset --hard HEAD
          git clean -fd
          git checkout main
          git reset --hard origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          cd /aiops
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Run performance tests
        run: |
          cd /aiops
          pytest tests/performance -v --benchmark-autosave

      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-results
          path: .benchmarks/
          retention-days: 30
